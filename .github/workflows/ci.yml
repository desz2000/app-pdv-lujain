name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RestaurantePDV.sln

      - name: Build
        run: dotnet build RestaurantePDV.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RestaurantePDV.sln --configuration Release --no-build --logger "console;verbosity=normal"
